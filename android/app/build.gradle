plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "com.google.firebase.firebase-perf"
}


// Force output to where Flutter expects it
android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "app-${variant.buildType.name}.apk"
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.apnagodam"
    compileSdk 36
    ndkVersion "28.2.13676358"



    buildDir = "${rootProject.projectDir}/../build/app"

    defaultConfig {
        applicationId "com.apnagodam"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        resourceConfigurations += ["en", "hi", "kn"]
    }

    aaptOptions {
        cruncherEnabled = false
        noCompress 'ttf', 'tflite', 'svg', 'css', 'js', 'html', 'frag', 't-rex'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*',
                '/META-INF/*.kotlin_module'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            keyAlias 'apnagodam'
            keyPassword 'apnagodam'
            storeFile file("${rootDir}/../keystoe_file.jks")
            storePassword 'apnagodam'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            keyAlias 'apnagodam'
            keyPassword 'apnagodam'
            storeFile file("${rootDir}/../keystoe_file.jks")
            storePassword 'apnagodam'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-analytics'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}